<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブロック崩しゲーム</title>
    <style>
        /* CSS: 画面中央にゲーム画面を綺麗に配置 */
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            letter-spacing: 2px;
        }
        #gameContainer {
            position: relative;
        }
        canvas {
            background-color: #111;
            border: 4px solid #444;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            display: block;
        }
        .info {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h1>BLOCK BREAKER</h1>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="480" height="320"></canvas>
    </div>
    <div class="info">左右の矢印キー（← →）またはマウス移動でパドルを操作</div>

    <script>
        // JavaScript: ゲームのロジックと描画
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // ボールの設定
        let x = canvas.width / 2;
        let y = canvas.height - 30;
        let dx = 3;
        let dy = -3;
        const ballRadius = 8;

        // パドルの設定
        const paddleHeight = 12;
        const paddleWidth = 75;
        let paddleX = (canvas.width - paddleWidth) / 2;
        let rightPressed = false;
        let leftPressed = false;

        // ブロックの設定
        const brickRowCount = 3;
        const brickColumnCount = 5;
        const brickWidth = 75;
        const brickHeight = 20;
        const brickPadding = 10;
        const brickOffsetTop = 30;
        const brickOffsetLeft = 30;

        // スコアとゲーム状態
        let score = 0;
        let gameOver = false;
        let gameWon = false;

        // ブロックの二次元配列を初期化 (status: 1 は存在する、0 は破壊された)
        const bricks = [];
        for (let c = 0; c < brickColumnCount; c++) {
            bricks[c] = [];
            for (let r = 0; r < brickRowCount; r++) {
                bricks[c][r] = { x: 0, y: 0, status: 1 };
            }
        }

        // キーボードイベントの監視
        document.addEventListener("keydown", keyDownHandler, false);
        document.addEventListener("keyup", keyUpHandler, false);
        // マウスイベントの監視
        document.addEventListener("mousemove", mouseMoveHandler, false);

        function keyDownHandler(e) {
            if (e.key === "Right" || e.key === "ArrowRight") {
                rightPressed = true;
            } else if (e.key === "Left" || e.key === "ArrowLeft") {
                leftPressed = true;
            }
        }

        function keyUpHandler(e) {
            if (e.key === "Right" || e.key === "ArrowRight") {
                rightPressed = false;
            } else if (e.key === "Left" || e.key === "ArrowLeft") {
                leftPressed = false;
            }
        }

        function mouseMoveHandler(e) {
            const relativeX = e.clientX - canvas.getBoundingClientRect().left;
            if (relativeX > 0 && relativeX < canvas.width) {
                paddleX = relativeX - paddleWidth / 2;
            }
        }

        // 衝突判定 (ボールがブロックに当たったか)
        function collisionDetection() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    const b = bricks[c][r];
                    if (b.status === 1) {
                        if (x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
                            dy = -dy;
                            b.status = 0; // ブロックを消す
                            score++;
                            if (score === brickRowCount * brickColumnCount) {
                                gameWon = true;
                            }
                        }
                    }
                }
            }
        }

        // ボールの描画
        function drawBall() {
            ctx.beginPath();
            ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = "#0095DD";
            ctx.fill();
            ctx.closePath();
        }

        // パドルの描画
        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddleX, canvas.height - paddleHeight - 5, paddleWidth, paddleHeight);
            ctx.fillStyle = "#00e676";
            ctx.fill();
            ctx.closePath();
        }

        // ブロックの描画
        function drawBricks() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    if (bricks[c][r].status === 1) {
                        const brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
                        const brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;
                        ctx.beginPath();
                        ctx.rect(brickX, brickY, brickWidth, brickHeight);
                        // 行ごとに色を変える
                        ctx.fillStyle = r === 0 ? "#ff1744" : r === 1 ? "#ffea00" : "#2979ff";
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        // スコアの描画
        function drawScore() {
            ctx.font = "16px sans-serif";
            ctx.fillStyle = "#ffffff";
            ctx.fillText(`SCORE: ${score}`, 8, 20);
        }

        // メッセージ画面の描画
        function drawMessage(text, color) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = "bold 24px sans-serif";
            ctx.fillStyle = color;
            ctx.textAlign = "center";
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            ctx.font = "14px sans-serif";
            ctx.fillStyle = "#ffffff";
            ctx.fillText("画面をリロードして再挑戦", canvas.width / 2, canvas.height / 2 + 40);
        }

        // メインのゲームループ
        function draw() {
            if (gameOver || gameWon) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBricks();
            drawBall();
            drawPaddle();
            drawScore();
            collisionDetection();

            // 壁との衝突判定 (左右)
            if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
                dx = -dx;
            }
            // 壁との衝突判定 (上)
            if (y + dy < ballRadius) {
                dy = -dy;
            } 
            // 下の壁（パドルとの判定）
            else if (y + dy > canvas.height - ballRadius - 5) {
                if (x > paddleX && x < paddleX + paddleWidth) {
                    // パドルの端に当たるほど角度がつくように調整
                    let hitPos = (x - paddleX) / paddleWidth;
                    dx = 8 * (hitPos - 0.5);
                    dy = -dy;
                } else {
                    gameOver = true;
                }
            }

            // パドルの移動制限
            if (rightPressed && paddleX < canvas.width - paddleWidth) {
                paddleX += 7;
            } else if (leftPressed && paddleX > 0) {
                paddleX -= 7;
            }

            // ボールの位置更新
            x += dx;
            y += dy;

            // 終了判定の描画
            if (gameOver) {
                drawMessage("GAME OVER", "#ff1744");
            } else if (gameWon) {
                drawMessage("CLEAR! YOU WIN!", "#00e676");
            }

            requestAnimationFrame(draw);
        }

        // ゲームスタート
        draw();
    </script>
</body>
</html>
